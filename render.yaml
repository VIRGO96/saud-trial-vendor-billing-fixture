services:
  - type: web
    name: vendor-billing-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./vendor_billing.db
      - key: SEED_DEMO
        value: "true"
      - key: SAMPLES_DIR
        value: ../samples
      - key: FIXTURES_DIR
        value: ../fixtures

  - type: web
    name: vendor-billing-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: BACKEND_URL
        fromService:
          type: web
          name: vendor-billing-backend
          property: host
